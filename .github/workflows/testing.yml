name: Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

jobs:
  test:
    name: CI (node${{ matrix.node }})
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: yarn
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run test suite
        if: matrix.node != 26
        run: yarn test

      - name: Run coverage report
        if: matrix.node == 26
        run: yarn coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.node == 26
        with:
          name: coverage-data-${{ github.run_id }}
          path: |
            coverage/**/*.json

      - name: Coverage summary
        if: matrix.node == 26
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          format: "markdown"
          output: "both"

      - name: Add coverage PR comment
        if: matrix.node == 26
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write to job summary
        if: always() && matrix.node == 26
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  # --- Lint pre-compiled assets for consistency --- #
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node LTS version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      ## --- YARN CACHE --- ##
      - name: Check for cached dependencies
        continue-on-error: true
        id: cache-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/yarn
            node_modules
          key: ubuntu-latest-node${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}

      ## --- INSTALL --- ##
      # If statement isn't needed here b/c yarn will leverage the cache if it exists
      - name: Install dependencies
        shell: bash
        run: yarn install --immutable

      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47
        with:
          files_yaml: |
            eslint:
              - '*.js'

      - name: Run eslint
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        if: ${{ steps.changed-files.outputs.eslint_added_files != '' || steps.changed-files.outputs.eslint_modified_files != '' }}
        with:
          fail_level: error
          level: error
          reporter: github-pr-review
          filter_mode: diff_context
          #   eslint_flags: "components/*/stories/*.js"
          eslint_flags: "--config ${{ github.workspace }}/eslint.config.js ${{ steps.changed-files.outputs.eslint_added_files }} ${{ steps.changed-files.outputs.eslint_modified_files }}"

      - name: Run lint
        run: yarn lint --fix

      # This step will evaluate the repo status and report the change
      # If there are changes, capture the changes and upload them as an artifact
      - name: Check if there are changes
        shell: bash
        run: |
          if [[ -z $(git status --porcelain) ]]; then
              echo "No changes detected"
              exit 0
          else
              echo "Changes detected"
              git status
              git add .
              exit 1
          fi
